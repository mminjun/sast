# SAST 게이트 — PR마다 우리 룰셋(catalog/rules)으로 스캔하고 신규 HIGH가 있으면 차단한다.
#
# 흐름: head(PR)와 base를 각각 체크아웃 → 같은 룰셋으로 두 번 스캔 → scripts/sast_gate.py가
# 서버와 같은 핑거프린트(catalog/fingerprint.py)로 신규/해결/유지를 나눔 → job summary와
# PR 코멘트에 요약 → 신규 HIGH ≥ 1이면 실패. 서버의 diff API는 쓰지 않는다 — 러너에서
# 서버에 접근할 수 없고, 쓰려면 소스 업로드와 인증 시크릿이 필요하다 (docs/decisions.md
# 2026-09-04). RFP 외 자체 개선.
name: SAST gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # 결과 코멘트

concurrency:
  group: sast-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # requirements.txt와 같은 버전 — 서버와 CI의 탐지 결과가 어긋나지 않게 고정한다.
  SEMGREP_VERSION: '1.175.0'

jobs:
  scan:
    name: scan & gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout head (PR merge ref)
        uses: actions/checkout@v4

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install semgrep
        run: pip install --quiet "semgrep==${SEMGREP_VERSION}"

      # 스캔 제외 목록. catalog/samples·dogfood는 룰 검증·시연용으로 일부러 취약하게 만든
      # 파일이고, tests.py는 취약 패턴을 문자열 픽스처로 담고 있다 — 의도적으로 취약한
      # 샘플/픽스처라 진단 대상이 아니다. 이걸 넣으면 모든 PR이 항상 실패해 게이트가
      # 무의미해진다. base/는 아래 base 체크아웃 디렉토리, 나머지는 의존성·빌드 산출물.
      # .semgrepignore 파일을 쓰지 않는 이유: Semgrep이 cwd의 .semgrepignore를 읽으므로
      # 서버(cwd=저장소 루트)가 고객 소스를 스캔할 때까지 제외 규칙이 새어 들어간다.
      - name: Scan head (PR)
        run: |
          start=$(date +%s)
          semgrep scan --config=catalog/rules --json --quiet --metrics=off \
            --exclude=catalog/samples --exclude=dogfood --exclude='tests.py' \
            --exclude=base --exclude=venv --exclude=frontend --exclude=node_modules \
            --output=head.json .
          echo "head scan: $(( $(date +%s) - start ))s"

      # 룰셋은 head의 catalog/rules를 양쪽에 같이 쓴다 — 룰을 바꾸는 PR에서 base 룰과
      # head 룰이 섞이면 비교가 무의미해진다. cwd를 base/로 두어 결과 경로가 head와
      # 같은 상대경로 형식이 되게 한다.
      - name: Scan base
        working-directory: base
        run: |
          start=$(date +%s)
          semgrep scan --config=../catalog/rules --json --quiet --metrics=off \
            --exclude=catalog/samples --exclude=dogfood --exclude='tests.py' \
            --exclude=venv --exclude=frontend --exclude=node_modules \
            --output=../base.json .
          echo "base scan: $(( $(date +%s) - start ))s"

      - name: Gate (new HIGH → fail)
        run: |
          python scripts/sast_gate.py \
            --head head.json --head-root . \
            --base base.json --base-root base \
            --head-label "${{ github.event.pull_request.head.ref }}" \
            --base-label "${{ github.event.pull_request.base.ref }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --comment sast-comment.md

      # 게이트가 실패해도 코멘트는 남긴다. 마커(<!-- sast-gate -->)로 이전 코멘트를 찾아
      # 갱신하므로 PR에 코멘트가 쌓이지 않는다. 포크 PR은 토큰이 읽기 전용이라 실패할 수
      # 있는데, 그 경우에도 job summary에는 같은 내용이 남는다.
      - name: Comment on PR
        if: always() && hashFiles('sast-comment.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- sast-gate -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@sast-comment.md > /dev/null
            echo "updated comment ${existing}"
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@sast-comment.md > /dev/null
            echo "created comment"
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-scan-results
          path: |
            head.json
            base.json
            sast-comment.md
          retention-days: 14
