# KISA 입력데이터 검증 및 표현 (IV) — Python taint 룰 (mode: taint)
#
# 한 지점 패턴(iv_input_validation.yaml)이 "싱크 인자에 입력이 직접 보이는 형태"만 잡는 것과 달리,
# 이 파일의 룰은 "외부 입력이 변수·가공을 거쳐 위험한 지점(싱크)까지 흘러가는가"를 본다.
# 인젝션 계열 7항목(IV-01·02·03·04·05·07·12)은 이 파일이 담당하고, 같은 항목의 패턴 룰은 지웠다 —
# 둘을 병행하면 같은 줄이 두 번 보고된다(핑거프린트는 rule_code 기준이라 순번만 달라진다,
# docs/decisions.md 2026-09-06 taint). 설정·API 오용·에러처리 계열은 흐름이 아니라 호출 자체가
# 문제라 패턴 룰 그대로다.
#
# 소스(외부 입력)로 보는 것 — 7룰 공통:
#   (a) 함수의 매개변수(self·cls 제외). 지금까지의 패턴 룰이 "매개변수가 싱크에 들어가면 잡던"
#       감도를 유지하려면 필수다. 호출자가 어디서 값을 가져오는지 모르는 헬퍼 함수는 매개변수를
#       신뢰할 수 없다고 본다. 정밀도는 상수 추적(상수만 흐르면 안 잡음)과 아래 sanitizer가 더한다.
#   (b) 웹 요청 값: request.GET/POST/args/form/data/json/values/cookies/headers 의 .get()·[...]·
#       request.body·request.get_json().
#   (c) 프로세스 밖 입력: input(), sys.argv, os.environ.
# sanitizer(여기서부터는 깨끗하다고 보는 것) — 공통: int()/float() 변환, allowlist 검사
# (`if x in ALLOWED:` / `if x not in ALLOWED: raise`), 정규식 검사(`if not re.fullmatch(...): raise`),
# 이름 규약 validate_*/sanitize_*/clean_*/escape_* 함수(본문을 보지 못하므로 이름으로 신뢰 — 자체
# taint 구현이 본문을 볼 때까지의 임시 규칙). 항목별 sanitizer는 각 룰에 있다.
#
# Semgrep 1.175.0 OSS 실측 한계 (docs/decisions.md 2026-09-06): 함수 안에서만 추적한다 — 호출자에서
# 헬퍼로, 파일 간, 클래스 필드(다른 메서드에서 대입)로는 흐르지 않는다. 검증 형태는 선언한 것만
# sanitizer로 인식한다. 오염 경로는 JSON에 없고 텍스트 출력에만 있다(catalog/taint_trace.py).
#
# metadata.engine: semgrep-taint — 결과의 extra.engine에 그대로 실린다(패턴 룰은 semgrep-pattern).
# 룰 id 접미사 -taint. 핑거프린트는 KISA 코드 기준이라 id가 달라도 이전 실행과 짝지어진다.
#
# 소스·공통 sanitizer 블록은 YAML 앵커로 한 번만 적고 룰마다 참조한다.

_common:
  sources: &sources
    - patterns:
        - pattern: |
            def $FUNC(..., $PARAM, ...):
              ...
        - focus-metavariable: $PARAM
        - metavariable-regex:
            metavariable: $PARAM
            regex: ^(?!self$|cls$).*$
    - pattern: request.$M.get(...)
    - pattern: request.$M[...]
    - pattern: request.body
    - pattern: request.get_json(...)
    - pattern: input(...)
    - pattern: sys.argv
    - pattern: os.environ.get(...)
    - pattern: os.environ[...]
    - pattern: os.getenv(...)
  # 값 sanitizer — 이 호출의 반환값은 깨끗하다
  value_sanitizers: &value_sanitizers
    patterns:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          # 이름 규약 — validate_/sanitize_/clean_/escape_ 로 시작하는 함수·메서드의 반환값
          - patterns:
              - pattern-either:
                  - pattern: $F(...)
                  - pattern: $O.$F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(validate|sanitize|sanitise|clean|escape)_\w+$
  # 검사 sanitizer — 검사를 지난 뒤의 변수를 깨끗하다고 본다 (by-side-effect: 값이 아니라 변수에 표시)
  check_sanitizers: &check_sanitizers
    by-side-effect: true
    patterns:
      - pattern-either:
          # allowlist 검사
          - pattern: |
              if $X in $ALLOWED:
                ...
          - pattern: |
              if $X not in $ALLOWED:
                ...
          # 정규식 검사 뒤 early return/raise
          - patterns:
              - pattern-either:
                  - pattern: |
                      if not re.$FN($P, $X, ...):
                        ...
                  - pattern: |
                      if re.$FN($P, $X, ...) is None:
                        ...
                  - pattern: |
                      if not $RE.$FN($X, ...):
                        ...
              - metavariable-regex:
                  metavariable: $FN
                  regex: ^(fullmatch|match|search)$
      - focus-metavariable: $X

rules:
  - id: kisa-iv-01-sql-injection-taint
    languages: [python]
    severity: ERROR
    message: >-
      SQL 삽입 (KISA-IV-01). 외부 입력이 검증 없이 SQL 질의 문자열로 흘러 들어갑니다.
      문자열 결합·포매팅 대신 파라미터 바인딩(placeholder)을 사용하세요.
    metadata:
      kisa_code: KISA-IV-01
      kisa_name: SQL 삽입
      cwe: CWE-89
      engine: semgrep-taint
    mode: taint
    pattern-sources: *sources
    pattern-sanitizers:
      - *value_sanitizers
      - *check_sanitizers
      # psycopg2.sql 조합 — 식별자·리터럴을 드라이버가 인용한다
      - pattern: sql.Identifier(...)
      - pattern: sql.Literal(...)
      - pattern: $CONN.ops.quote_name(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CURSOR.execute($QUERY, ...)
              - pattern: $CURSOR.executemany($QUERY, ...)
              - pattern: $CURSOR.executescript($QUERY)
              - pattern: $MODEL.raw($QUERY, ...)
          - focus-metavariable: $QUERY

  - id: kisa-iv-02-code-injection-taint
    languages: [python]
    severity: ERROR
    message: >-
      코드삽입 (KISA-IV-02). 외부에서 들어온 값이 코드로 해석되어 실행될 수 있습니다.
      eval/exec 대신 명시적인 분기나 안전한 파서를 사용하세요.
    metadata:
      kisa_code: KISA-IV-02
      kisa_name: 코드삽입
      cwe: CWE-94
      engine: semgrep-taint
    mode: taint
    pattern-sources: *sources
    pattern-sanitizers:
      - *value_sanitizers
      - *check_sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE, ...)
              - pattern: exec($CODE, ...)
          - focus-metavariable: $CODE

  - id: kisa-iv-03-path-manipulation-taint
    languages: [python]
    severity: ERROR
    message: >-
      경로 조작 및 자원 삽입 (KISA-IV-03). 외부 입력으로 만든 경로를 검증 없이 열고 있습니다.
      허용된 디렉토리 기준으로 정규화(resolve)한 뒤 그 안에 있는지 확인하세요.
    metadata:
      kisa_code: KISA-IV-03
      kisa_name: 경로 조작 및 자원 삽입
      cwe: CWE-22
      engine: semgrep-taint
    mode: taint
    pattern-sources: *sources
    pattern-sanitizers:
      - *value_sanitizers
      - *check_sanitizers
      # 파일 이름만 남기면 상위 디렉토리로 못 나간다
      - pattern: os.path.basename(...)
      - pattern: secure_filename(...)
      - pattern: $P.name
      # 허용 디렉토리 안인지 확인한 뒤의 경로 (is_relative_to / relative_to 검사)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: |
                  if not $P.is_relative_to(...):
                    ...
              - pattern: |
                  if $P.is_relative_to(...):
                    ...
              - pattern: $P.relative_to(...)
          - focus-metavariable: $P
    # 싱크는 열기·읽기·쓰기·전송. 삭제·이름 변경(os.remove 등)은 넣지 않는다 — 경로를 받아 지우는
    # 헬퍼(cleanup(path))가 전부 걸려 신호가 묻힌다. `$P.open(...)`도 뺐다 — 타입을 모르는 Semgrep에선
    # ZipFile.open(member) 같은 무관한 .open()이 전부 걸린다(자체 저장소 도그푸딩 실측). 둘 다 알려진
    # 미탐 범위로 decisions에 기록.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: $PATH.read_text(...)
              - pattern: $PATH.read_bytes()
              - pattern: $PATH.write_text(...)
              - pattern: $PATH.write_bytes(...)
              - pattern: send_file($PATH, ...)
          - focus-metavariable: $PATH

  - id: kisa-iv-04-xss-taint
    languages: [python]
    severity: ERROR
    message: >-
      크로스사이트 스크립트 (KISA-IV-04). 외부 입력이 이스케이프 없이 HTML 응답으로 흘러
      들어갑니다. 템플릿의 자동 이스케이프를 쓰거나 escape()로 처리한 뒤 출력하세요.
    metadata:
      kisa_code: KISA-IV-04
      kisa_name: 크로스사이트 스크립트
      cwe: CWE-79
      engine: semgrep-taint
    mode: taint
    pattern-sources: *sources
    pattern-sanitizers:
      - *value_sanitizers
      - *check_sanitizers
      - pattern: escape(...)
      - pattern: html.escape(...)
      - pattern: conditional_escape(...)
      - pattern: markupsafe.escape(...)
      - pattern: bleach.clean(...)
      # format_html은 인자를 이스케이프한 뒤 조합한다
      - pattern: format_html(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: HttpResponse($BODY, ...)
              - pattern: HttpResponse(content=$BODY, ...)
              - pattern: mark_safe($BODY)
              - pattern: Markup($BODY)
              - pattern: render_template_string($BODY, ...)
          - focus-metavariable: $BODY

  - id: kisa-iv-05-os-command-injection-taint
    languages: [python]
    severity: ERROR
    message: >-
      운영체제 명령어 삽입 (KISA-IV-05). 외부 입력이 검증 없이 셸 명령으로 흘러 들어갑니다.
      shell=True를 피하고 인자를 리스트로 전달하세요.
    metadata:
      kisa_code: KISA-IV-05
      kisa_name: 운영체제 명령어 삽입
      cwe: CWE-78
      engine: semgrep-taint
    mode: taint
    pattern-sources: *sources
    pattern-sanitizers:
      - *value_sanitizers
      - *check_sanitizers
      - pattern: shlex.quote(...)
    # 인자를 리스트로 넘기는 subprocess.run([...]) (shell 없음)은 싱크가 아니다.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD

  - id: kisa-iv-07-open-redirect-taint
    languages: [python]
    severity: WARNING
    message: >-
      신뢰되지 않는 URL 주소로 자동접속 연결 (KISA-IV-07). 외부 입력이 검증 없이
      리다이렉트 대상으로 흘러 들어갑니다. 허용 목록으로 대상 경로를 제한하세요.
    metadata:
      kisa_code: KISA-IV-07
      kisa_name: 신뢰되지 않는 URL 주소로 자동접속 연결
      cwe: CWE-601
      engine: semgrep-taint
    mode: taint
    pattern-sources: *sources
    pattern-sanitizers:
      - *value_sanitizers
      - *check_sanitizers
      # Django의 오픈 리다이렉트 검사 — 통과한 뒤의 값
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: |
                  if not url_has_allowed_host_and_scheme($URL, ...):
                    ...
              - pattern: |
                  if url_has_allowed_host_and_scheme($URL, ...):
                    ...
          - focus-metavariable: $URL
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: redirect($URL, ...)
              - pattern: HttpResponseRedirect($URL, ...)
              - pattern: HttpResponsePermanentRedirect($URL, ...)
          - focus-metavariable: $URL

  - id: kisa-iv-12-ssrf-taint
    languages: [python]
    severity: ERROR
    message: >-
      서버사이드 요청 위조 (KISA-IV-12). 외부 입력이 검증 없이 서버가 요청을 보내는 주소로
      흘러 들어갑니다. 허용 목록으로 대상 호스트를 제한하세요.
    metadata:
      kisa_code: KISA-IV-12
      kisa_name: 서버사이드 요청 위조
      cwe: CWE-918
      engine: semgrep-taint
    mode: taint
    pattern-sources: *sources
    pattern-sanitizers:
      - *value_sanitizers
      - *check_sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              # 메서드 이름 제한은 이 분기 안에만 건다 — 바깥에 두면 $METHOD가 바인딩되지 않는
              # urlopen 분기까지 걸러진다 (docs/decisions.md 2026-09-05 IV-01·SF-06과 같은 함정).
              - patterns:
                  - pattern-either:
                      - pattern: requests.$METHOD($URL, ...)
                      - pattern: httpx.$METHOD($URL, ...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|patch|delete|head|options|request)$
              - pattern: urllib.request.urlopen($URL, ...)
          - focus-metavariable: $URL
