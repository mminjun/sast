# KISA 제4절 에러처리 (EH) — Java 실탐지 룰 (SFR-010, SFR-011)
# 매핑·심각도·한계 원칙은 c_iv_input_validation.yaml 머리말 참조. 패턴은 프로토타입으로
# 정탐·오탐을 실측한 뒤 옮긴 것이며, 룰별로 무엇을 놓치는지는 docs/decisions.md
# 2026-09-05(Java·JS 룰) 참조.

rules:
  - id: kisa-eh-01-java-error-message-disclosure
    languages: [java]
    severity: WARNING
    message: >-
      오류 메시지 정보노출 (KISA-EH-01). 예외 메시지·스택트레이스가 응답으로 나가면 내부 구조·질의문·경로가 노출됩니다. 사용자에겐 일반화된
      메시지를 주고 상세는 서버 로그에만 남기세요.
    metadata:
      kisa_code: KISA-EH-01
      kisa_name: 오류 메시지 정보노출
      cwe: CWE-209
    pattern-either:
      - pattern: $E.printStackTrace($RESP.getWriter())
      - pattern: $RESP.getWriter().$P(<... $E.getMessage() ...>)
      - pattern: $RESP.getWriter().$P(<... $E.toString() ...>)
      - pattern: $RESP.getWriter().$P(<... $E.getStackTrace() ...>)
      - pattern: ResponseEntity.status(...).body(<... $E.getMessage() ...>)
      - pattern: ResponseEntity.status(...).body(<... $E.getStackTrace() ...>)
      - pattern: new ResponseEntity<>(<... $E.getMessage() ...>, ...)
      - pattern: $MODEL.addAttribute("...", $E.getMessage())
      - pattern: $MODEL.addAttribute("...", $E.getStackTrace())

  - id: kisa-eh-03-java-improper-exception-handling
    languages: [java]
    severity: INFO
    message: >-
      부적절한 예외 처리 (KISA-EH-03). 예외를 잡고 아무것도 하지 않으면 오류가 숨겨져 문제를 늦게 발견합니다. 로그를 남기거나 다시 던지세요.
    metadata:
      kisa_code: KISA-EH-03
      kisa_name: 부적절한 예외 처리
      cwe: CWE-390
    pattern-either:
      - pattern: |
          try { ... } catch ($T $E) { }
      - pattern: |
          try { ... } catch ($T $E) { ; }
