# KISA 제3절 시간 및 상태 (TS) — Java 실탐지 룰 (SFR-010, SFR-011)
# 매핑·심각도·한계 원칙은 c_iv_input_validation.yaml 머리말 참조. 패턴은 프로토타입으로
# 정탐·오탐을 실측한 뒤 옮긴 것이며, 룰별로 무엇을 놓치는지는 docs/decisions.md
# 2026-09-05(Java·JS 룰) 참조.

rules:
  - id: kisa-ts-01-java-toctou
    languages: [java]
    severity: WARNING
    message: >-
      경쟁조건: 검사 시점과 사용 시점(TOCTOU) (KISA-TS-01). exists/canRead/canWrite로 검사한 뒤 같은 파일을 여는
      사이에 파일이 바뀌면 검사가 무효가 됩니다. 검사 없이 열고 예외로 판단하세요.
    metadata:
      kisa_code: KISA-TS-01
      kisa_name: '경쟁조건: 검사 시점과 사용 시점(TOCTOU)'
      cwe: CWE-367
    # C 룰과 같은 구조 — 같은 메서드 안에서 같은 파일 변수에 대해 검사→열기가 이어질 때만.
    pattern-either:
      - pattern: |
          if ($F.exists()) { ... new FileInputStream($F); ... }
      - pattern: |
          if ($F.exists()) { ... new FileOutputStream($F); ... }
      - pattern: |
          if ($F.exists()) { ... new FileReader($F); ... }
      - pattern: |
          if ($F.exists()) { ... new FileWriter($F); ... }
      - pattern: |
          if ($F.exists()) { ... Files.$OP($F.toPath(), ...); ... }
      - pattern: |
          if (Files.exists($P)) { ... Files.$OP($P, ...); ... }
      - pattern: |
          if ($F.canWrite()) { ... new FileOutputStream($F); ... }
      - pattern: |
          if ($F.canRead()) { ... new FileInputStream($F); ... }
