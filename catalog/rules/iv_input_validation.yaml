# KISA 제1절 입력데이터 검증 및 표현 (IV) — Python 실탐지 룰 (한 지점 패턴)
#
# 인젝션 계열 7항목(IV-01·02·03·04·05·07·12)은 2026-09-06부터 taint_python.yaml(mode: taint)이
# 담당한다 — 여기 있던 같은 항목의 패턴 룰은 지웠다(병행하면 같은 줄이 두 번 보고된다).
# 이 파일에는 "입력의 흐름"이 아니라 "설정·호출 자체"가 판정 근거인 항목만 남는다.
#
# metadata.kisa_code가 카탈로그 항목(catalog_rule.code)과의 매핑 단일 원본이다.
# 시드 커맨드(seed_catalog)가 이 값을 읽어 해당 항목의 semgrep_rule_ids를 채우므로,
# 룰을 추가하면 코드 수정 없이 카탈로그가 '실탐지 구현됨'으로 바뀐다 (SFR-012, QLT-002).
#
# severity(ERROR/WARNING/INFO)는 Semgrep 형식상 필수라 적지만 최종 등급이 아니다.
# 최종 심각도는 카탈로그의 KISA 유형 기반 등급이며, 이 값은 매핑 실패 시에만
# 폴백으로 쓰인다 (QLT-004, docs/decisions.md).

rules:
  - id: kisa-iv-11-csrf-exempt
    languages: [python]
    severity: WARNING
    message: >-
      크로스사이트 요청 위조 (KISA-IV-11). csrf_exempt는 해당 뷰의 CSRF 방어를 통째로
      끕니다. 꼭 필요한 예외가 아니라면 제거하고 CSRF 미들웨어 보호를 유지하세요.
    metadata:
      kisa_code: KISA-IV-11
      kisa_name: 크로스사이트 요청 위조
      cwe: CWE-352
    pattern-either:
      - pattern: |
          @csrf_exempt
          def $FUNC(...):
            ...
      - pattern: |
          @method_decorator(csrf_exempt, ...)
          class $CLS(...):
            ...
