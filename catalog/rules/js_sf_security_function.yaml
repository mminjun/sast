# KISA 제2절 보안기능 (SF) — JavaScript/TypeScript 실탐지 룰 (SFR-010, SFR-011)
# 매핑·심각도·한계 원칙은 c_iv_input_validation.yaml 머리말 참조. 패턴은 프로토타입으로
# 정탐·오탐을 실측한 뒤 옮긴 것이며, 룰별로 무엇을 놓치는지는 docs/decisions.md
# 2026-09-05(Java·JS 룰) 참조.

rules:
  - id: kisa-sf-03-js-insecure-permission
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      중요한 자원에 대한 잘못된 권한 설정 (KISA-SF-03). 다른 사용자(others)에게 쓰기를 허용하는 모드입니다. 0o600·0o640처럼 최소
      권한을 주고 process.umask(0)은 쓰지 마세요.
    metadata:
      kisa_code: KISA-SF-03
      kisa_name: 중요한 자원에 대한 잘못된 권한 설정
      cwe: CWE-732
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: fs.chmodSync($P, $MODE)
              - pattern: fs.chmod($P, $MODE, ...)
              - pattern: fs.fchmodSync($P, $MODE)
              - pattern: fs.mkdirSync($P, $MODE)
              - pattern: 'fs.mkdirSync($P, {..., mode: $MODE, ...})'
              - pattern: 'fs.writeFileSync($P, $D, {..., mode: $MODE, ...})'
              - pattern: fs.openSync($P, $F, $MODE)
          - metavariable-regex:
              metavariable: $MODE
              regex: '^(0o?[0-7]*[2367]|["''][0-7]*[2367]["''])$'
      - pattern: process.umask(0)
      - pattern: process.umask(0o000)

  - id: kisa-sf-04-js-weak-crypto-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      취약한 암호화 알고리즘 사용 (KISA-SF-04). md5·sha1·des·rc4·aes-*-ecb는 안전성이 깨진 알고리즘입니다. sha256
      이상, aes-256-gcm으로 교체하세요.
    metadata:
      kisa_code: KISA-SF-04
      kisa_name: 취약한 암호화 알고리즘 사용
      cwe: CWE-327
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: crypto.createHash($ALG, ...)
              - pattern: crypto.createHmac($ALG, ...)
              - pattern: crypto.createCipheriv($ALG, ...)
              - pattern: crypto.createDecipheriv($ALG, ...)
              - pattern: crypto.createCipher($ALG, ...)
              - pattern: createHash($ALG, ...)
              - pattern: createCipheriv($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^["'`](md4|md5|sha-?1|ripemd|des(-.*)?|des-ede.*|rc2(-.*)?|rc4(-.*)?|bf(-.*)?|blowfish.*|aes-\d+-ecb)["'`]$
      - pattern: CryptoJS.MD5(...)
      - pattern: CryptoJS.SHA1(...)
      - pattern: CryptoJS.DES.encrypt(...)
      - pattern: CryptoJS.RC4.encrypt(...)

  - id: kisa-sf-06-js-hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      하드코드된 중요정보 (KISA-SF-06). 비밀번호·키·토큰이 소스에 상수로 들어 있습니다. process.env나 시크릿 저장소에서 읽으세요.
    metadata:
      kisa_code: KISA-SF-06
      kisa_name: 하드코드된 중요정보
      cwe: CWE-798
    # 비밀 이름의 변수·속성에 리터럴, process.env.X || '리터럴' 폴백. 빈 문자열은 제외.
    patterns:
      - pattern-either:
          - pattern: $NAME = "..."
          - pattern: $OBJ.$NAME = "..."
          - pattern: '{..., $NAME: "...", ...}'
          - pattern: process.env.$NAME || "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^[a-z_]*(password|passwd|pwd|secret|api_?key|access_?key|private_?key|token)[a-z_0-9]*$
      - pattern-not: $NAME = ""
      - pattern-not: $OBJ.$NAME = ""
      - pattern-not: '{..., $NAME: "", ...}'
      - pattern-not: process.env.$NAME || ""

  - id: kisa-sf-07-js-insufficient-key-length
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      충분하지 않은 키 길이 사용 (KISA-SF-07). 2048비트 미만 RSA/DSA/DH 키는 전수 대입으로 깨집니다. modulusLength
      2048 이상(권장 3072+)으로 생성하세요.
    metadata:
      kisa_code: KISA-SF-07
      kisa_name: 충분하지 않은 키 길이 사용
      cwe: CWE-326
    patterns:
      - pattern-either:
          - pattern: 'crypto.generateKeyPairSync("rsa", {..., modulusLength: $BITS, ...})'
          - pattern: 'crypto.generateKeyPair("rsa", {..., modulusLength: $BITS, ...}, ...)'
          - pattern: 'crypto.generateKeyPairSync("dsa", {..., modulusLength: $BITS, ...})'
          - pattern: 'generateKeyPairSync("rsa", {..., modulusLength: $BITS, ...})'
          - pattern: crypto.createDiffieHellman($BITS)
      - metavariable-comparison:
          metavariable: $BITS
          comparison: $BITS < 2048

  - id: kisa-sf-08-js-insecure-random
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      적절하지 않은 난수 값 사용 (KISA-SF-08). Math.random은 예측 가능한 의사난수라 토큰·세션 값 생성에 쓰면 안 됩니다.
      crypto.randomBytes/randomUUID를 사용하세요.
    metadata:
      kisa_code: KISA-SF-08
      kisa_name: 적절하지 않은 난수 값 사용
      cwe: CWE-338
    # Python·C·Java 룰과 같은 기준 — 보안 용도로 쓰이는 이름에 대입될 때만.
    patterns:
      - pattern-either:
          - pattern: $NAME = <... Math.random() ...>
          - pattern: $OBJ.$NAME = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^[a-z_]*(token|session|otp|password|passwd|secret|nonce|salt|key|reset|auth)[a-z_0-9]*$

  - id: kisa-sf-10-js-jwt-signature-not-verified
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      부적절한 전자서명 확인 (KISA-SF-10). 서명을 확인하지 않는 JWT 처리입니다(algorithm none 허용, decode 결과로 권한
      판단). jwt.verify를 허용 알고리즘 목록과 함께 사용하세요.
    metadata:
      kisa_code: KISA-SF-10
      kisa_name: 부적절한 전자서명 확인
      cwe: CWE-347
    pattern-either:
      - pattern: 'jwt.verify($T, $K, {..., algorithms: [..., "none", ...], ...}, ...)'
      - pattern: 'jwt.verify($T, $K, {..., algorithms: [..., ''none'', ...], ...}, ...)'
      - pattern: 'jwt.sign($P, $K, {..., algorithm: "none", ...})'
      - pattern: 'jwt.sign($P, $K, {..., algorithm: ''none'', ...})'
      - pattern: |
          $D = jwt.decode($T, ...);
          ...
          if (<... $D.$F ...>) { ... }
      - pattern: |
          $D = jwt.decode($T, ...);
          ...
          $REQ.user = $D;

  - id: kisa-sf-11-js-improper-cert-validation
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      부적절한 인증서 유효성 검증 (KISA-SF-11). TLS 인증서 검증을 끄고 있습니다(rejectUnauthorized:false 등). 검증을
      켜고 신뢰 CA를 지정하세요.
    metadata:
      kisa_code: KISA-SF-11
      kisa_name: 부적절한 인증서 유효성 검증
      cwe: CWE-295
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: '{..., checkServerIdentity: () => undefined, ...}'
      - pattern: '{..., checkServerIdentity: ($A, $B) => undefined, ...}'
      - pattern: '{..., strictSSL: false, ...}'

  - id: kisa-sf-12-js-persistent-sensitive-cookie
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      사용자 하드디스크에 저장되는 쿠키를 통한 정보 노출 (KISA-SF-12). 인증·세션 값을 maxAge/expires를 준 쿠키에 담으면 디스크에
      남아 로컬 접근자에게 노출됩니다. 만료 없는 세션 쿠키로 두세요.
    metadata:
      kisa_code: KISA-SF-12
      kisa_name: 사용자 하드디스크에 저장되는 쿠키를 통한 정보 노출
      cwe: CWE-539
    patterns:
      - pattern-either:
          - pattern: '$RES.cookie($NAME, $V, {..., maxAge: $AGE, ...})'
          - pattern: '$RES.cookie($NAME, $V, {..., expires: $EXP, ...})'
          - pattern: document.cookie = <... $NAME ...>
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^["'`][a-z_-]*(token|session|auth|password|passwd|secret|remember)[a-z_-]*(=[^"'`]*)?["'`]$

  - id: kisa-sf-13-js-secret-in-comment
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      주석문 안에 포함된 시스템 주요정보 (KISA-SF-13). 주석에 적힌 비밀번호·키는 소스 열람만으로 노출됩니다. 값은 지우고 시크릿 저장소·환경변수
      위치만 남기세요.
    metadata:
      kisa_code: KISA-SF-13
      kisa_name: 주석문 안에 포함된 시스템 주요정보
      cwe: CWE-615
    # Java·C 룰과 같은 정규식.
    patterns:
      - pattern-regex: '(//|/\*).*?(?i:password|passwd|pwd|secret|api[_-]?key|token)\s*[:=]\s*\S+'

  - id: kisa-sf-14-js-unsalted-password-hash
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      솔트 없이 일방향 해쉬 함수 사용 (KISA-SF-14). 솔트 없는 해시는 레인보우 테이블로 원문이 복원됩니다.
      bcrypt·scrypt·argon2를 사용하세요.
    metadata:
      kisa_code: KISA-SF-14
      kisa_name: 솔트 없이 일방향 해쉬 함수 사용
      cwe: CWE-759
    patterns:
      - pattern-either:
          - pattern: crypto.createHash($ALG).update($PW).digest(...)
          - pattern: crypto.createHash($ALG).update($PW, ...).digest(...)
          - pattern: createHash($ALG).update($PW).digest(...)
          - pattern: CryptoJS.SHA256($PW).toString(...)
          - pattern: CryptoJS.SHA256($PW)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i)^[a-z_]*(password|passwd|pwd)[a-z_0-9]*$
